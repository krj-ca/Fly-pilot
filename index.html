
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <title>Air-fly | Flight Simulator</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">✈ AIR-FLY</div>
      <div class="status">● SIMULATOR READY</div>
    </header>

    <main id="screen" class="screen">
      <section class="hero">
        <div class="eyebrow">FLIGHT OPERATIONS CENTER</div>
        <h1>YOUR SKY.<br><span>YOUR AIRPORT.</span></h1>
        <p>Manage an airport, prepare aircraft, and take to the skies.</p>

        <div class="menu">
          <button data-screen="pilot">✈ Start Flying</button>
          <button data-screen="airport">🏢 Manage Airport</button>
          <button data-screen="hangar">🛩 Aircraft Hangar</button>
          <button data-screen="settings">⚙ Settings</button>
        </div>

        <div class="stats">
          <div><strong>01</strong><span>YOUR AIRPORT</span></div>
          <div><strong>00</strong><span>FLIGHTS TODAY</span></div>
          <div><strong>READY</strong><span>FLIGHT STATUS</span></div>
        </div>
      </section>
    </main>

    <footer> AIR-FLY SIMULATOR · BUILD YOUR AVIATION WORLD </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
  </html>
